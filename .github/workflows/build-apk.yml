name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Verify project and launcher icon resources
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/lacviet/tuvi/MainActivity.java
          test -s app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s app/src/main/res/values/ic_launcher_background.xml
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-${density}/ic_launcher.png"
            test -s "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          grep -q '@mipmap/ic_launcher' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@mipmap/ic_launcher' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuViLacHong-ThienCung-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
